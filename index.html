<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS + JS Animations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
    }

    
    .btn {
      padding: 12px 24px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .btn:hover {
      transform: scale(1.1);
      background: #45a049;
    }

    /* Box with @keyframes animation */
    .box {
      width: 100px;
      height: 100px;
      margin: 40px auto;
      background: tomato;
      border-radius: 10px;
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
  <button class="btn">Hover Me</button>
  <div class="box"></div>
</body>
</html>
